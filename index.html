<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#16131F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Ритм</title>
  <style id="offline-utils">
.flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.flex-wrap{flex-wrap:wrap}.flex-shrink-0{flex-shrink:0}
.grid{display:grid}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
.items-center{align-items:center}.items-start{align-items:flex-start}
.justify-center{justify-content:center}.justify-between{justify-content:space-between}.justify-around{justify-content:space-around}
.relative{position:relative}.absolute{position:absolute}.inset-0{inset:0}.z-10{z-index:10}
.w-full{width:100%}.w-5{width:1.25rem}.w-6{width:1.5rem}.w-8{width:2rem}.w-9{width:2.25rem}.w-10{width:2.5rem}.w-11{width:2.75rem}.w-14{width:3.5rem}
.h-full{height:100%}.h-1\.5{height:.375rem}.h-2\.5{height:.625rem}.h-5{height:1.25rem}.h-6{height:1.5rem}.h-8{height:2rem}.h-9{height:2.25rem}.h-10{height:2.5rem}.h-11{height:2.75rem}
.min-h-full{min-height:100%}.min-w-0{min-width:0}
.max-w-lg{max-width:32rem}.max-w-sm{max-width:24rem}
.p-3{padding:.75rem}.p-3\.5{padding:.875rem}.p-4{padding:1rem}.p-6{padding:1.5rem}
.px-1{padding-left:.25rem;padding-right:.25rem}.px-2{padding-left:.5rem;padding-right:.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}.px-4{padding-left:1rem;padding-right:1rem}.px-5{padding-left:1.25rem;padding-right:1.25rem}
.py-1\.5{padding-top:.375rem;padding-bottom:.375rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}.py-2\.5{padding-top:.625rem;padding-bottom:.625rem}.py-3{padding-top:.75rem;padding-bottom:.75rem}.py-4{padding-top:1rem;padding-bottom:1rem}
.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}.mb-5{margin-bottom:1.25rem}
.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}
.mx-auto{margin-left:auto;margin-right:auto}
.gap-1{gap:.25rem}.gap-1\.5{gap:.375rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}
.rounded-md{border-radius:.375rem}.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}.rounded-2xl{border-radius:1rem}.rounded-3xl{border-radius:1.5rem}.rounded-full{border-radius:9999px}
.border{border-width:1px;border-style:solid;border-color:var(--line)}
.shadow-sm{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.overflow-hidden{overflow:hidden}.overflow-y-auto{overflow-y:auto}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text-center{text-align:center}.text-left{text-align:left}
.text-xs{font-size:.75rem;line-height:1rem}.text-sm{font-size:.875rem;line-height:1.25rem}.text-lg{font-size:1.125rem}.text-2xl{font-size:1.5rem}.text-5xl{font-size:3rem;line-height:1}
.font-medium{font-weight:500}.font-semibold{font-weight:600}
.tracking-tight{letter-spacing:-.025em}.tracking-wider{letter-spacing:.05em}.uppercase{text-transform:uppercase}
.text-white{color:#fff}.opacity-70{opacity:.7}.line-through{text-decoration:line-through}
.outline-none{outline:none}.block{display:block}.cursor-pointer{cursor:pointer}.aspect-square{aspect-ratio:1/1}
.transition-all{transition:all .15s ease}
  </style>
  <style>
    *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
    :root{ --bg:#F3EEE6; --card:#FFFEFA; --forest:#2D4A3E; --forest-soft:#E4EDE7; --muted:#8A8578; --taupe:#4A463C; --line:#E2DCD0; --chip:#EDE8DF; --input:#F7F4EF; --mid:#B7C9BC; --text:#1C1A16; --nav:var(--chip); }
    html,body,#root{ height:100%; min-height:100%; min-height:100dvh; min-height:100svh; margin:0; padding:0; background:var(--bg); background-color:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; color:var(--text); overscroll-behavior:none; -webkit-text-size-adjust:100%; }
    body{ -webkit-font-smoothing:antialiased; background:var(--bg); background-color:var(--bg); }
    .desktop-shell{ min-height:100%; min-height:100dvh; width:100%; }
    .app-frame{ width:100%; min-height:100%; min-height:100dvh; display:flex; flex-direction:column; background:var(--bg); }
    .app-frame > *{ flex:1 1 auto; min-height:0; height:100%; max-height:100%; }
    @media (min-width: 900px) {
      html, body, #root{ height:100%; overflow:hidden; }
      body{
        background:
          radial-gradient(ellipse 80% 50% at 15% 0%, rgba(45,74,62,0.12), transparent 55%),
          radial-gradient(ellipse 70% 45% at 90% 100%, rgba(183,201,188,0.18), transparent 50%),
          var(--bg);
      }
      .desktop-shell{
        min-height:100dvh; height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;
      }
      .app-frame{
        width:420px; max-width:calc(100vw - 48px); height:min(90vh, 900px); min-height:620px; border-radius:28px; overflow:hidden; flex:0 0 auto;
        box-shadow: 0 0 0 1px var(--line), 0 28px 80px rgba(0,0,0,0.16), 0 4px 16px rgba(0,0,0,0.06);
      }
    }
    @media (min-width: 1280px) { .app-frame{ width:440px; height:min(88vh, 940px); } }
    @media (min-width: 1600px) { .app-frame{ width:460px; height:min(86vh, 980px); } }
    .no-scrollbar::-webkit-scrollbar{ display:none; }
    .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
    .safe-bottom{ padding-bottom:env(safe-area-inset-bottom,8px); }
    .safe-top{ padding-top:env(safe-area-inset-top,0px); }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .animate-spin{ animation:spin .7s linear infinite; }
    @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
    .fade-in{ animation:fadeIn .22s ease-out; }
    @keyframes tabInRight{ from{ opacity:0; transform:translateX(28px) scale(.98); } to{ opacity:1; transform:none; } }
    @keyframes tabInLeft{ from{ opacity:0; transform:translateX(-28px) scale(.98); } to{ opacity:1; transform:none; } }
    .tab-in-right{ animation:tabInRight .32s cubic-bezier(.22,.61,.36,1) both; }
    .tab-in-left{ animation:tabInLeft .32s cubic-bezier(.22,.61,.36,1) both; }
    .break-words{ overflow-wrap:anywhere; word-break:break-word; }
    .offline-bar{ background:var(--taupe); color:#fff; font-size:12px; text-align:center; padding:6px 12px; }
    button,input,textarea,select{ font:inherit; color:inherit; }
    button{ background:transparent; border:none; padding:0; margin:0; cursor:pointer; -webkit-appearance:none; appearance:none; }
    .week-strip{ display:flex; justify-content:space-between; gap:4px; }
    .week-day{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 0; border-radius:16px; min-width:0; }
    .week-day-num{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; }
    .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; border-radius:14px; min-width:0; }
    .theme-toggle{ display:flex; gap:0; padding:3px; border-radius:14px; background:var(--input); }
    .theme-toggle button{ flex:1; padding:10px 12px; border-radius:12px; font-size:13px; font-weight:500; text-align:center; }
  </style>
</head>
